<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Missing Rupee</title>
<style>
:root{--ink:#0F172A;--mute:#64748B;--faint:#94A3B8;--navy:#343C6A;--blue:#1814F3;--line:#F1F5F9;--bg:#F8FAFC;--green:#DCFCE7;--amber:#FEF3C7}
*{box-sizing:border-box;margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:200px 1fr;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
aside{background:#fff;padding:25px 15px;position:sticky;top:0;height:100vh}
.logo{text-align:center;font-weight:700;font-size:16px;color:var(--navy);margin-bottom:25px}
.logo img{max-width:160px;max-height:100px}
nav button{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:6px;border-radius:12px;font-weight:700;font-size:14px;color:#718EBF}
nav button:hover{background:#E0E7FF}
nav button.on{background:var(--blue);color:#fff}
header{background:#fff;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}
h1{font-size:22px;color:var(--navy)}
.actions{display:flex;align-items:center;gap:10px}
#status{font-size:12px;color:var(--faint);white-space:nowrap}
.pill{background:#EEF2FF;color:var(--blue);font-weight:700;font-size:13px;padding:10px 16px;border-radius:20px}
.pill:hover{background:#E0E7FF}
.pill[disabled]{opacity:.6;cursor:wait}
#gsearch{width:220px;height:40px;border:0;border-radius:20px;background:#F5F7FA;padding:0 16px;font-size:12px}
.circ{width:40px;height:40px;border-radius:50%;background:#F5F7FA;display:grid;place-items:center;position:relative;font-size:16px;overflow:hidden}
.circ img,.avatar{width:20px;height:20px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#F5F7FA}
.bell{background:#FEF5F5}
#bellN{position:absolute;top:-2px;right:-2px;background:#FF4D4F;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
main{padding:20px 25px 40px}
.kick{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.06em}
h2{font-size:26px;margin:2px 0}
.sub{font-size:13px;color:var(--mute);margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:#fff;border-radius:16px;padding:20px}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:15px;font-weight:700}
.card .l{font-size:12px;color:var(--mute)}
.card .v{font-size:24px;font-weight:700;margin:4px 0}
.card .f{font-size:11px;color:var(--faint)}
.box{background:#fff;border-radius:12px;border:1px solid var(--line);padding:20px;margin-bottom:16px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar input,.bar select{height:38px;border:1px solid #E2E8F0;border-radius:10px;background:#fff;padding:0 12px;font-size:12px}
.bar input{flex:1;min-width:200px}
#count{font-size:12px;color:var(--mute);margin-left:auto}
.head,.row{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr 20px;gap:12px;align-items:center}
.head{padding:0 16px 8px;font-size:11px;font-weight:700;color:var(--faint)}
.row{width:100%;text-align:left;background:#fff;border-radius:10px;padding:10px 16px;margin-bottom:8px;min-height:58px}
.row:hover{box-shadow:0 0 0 2px #E0E7FF}
.who{display:flex;gap:12px;align-items:center}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.row small,.who small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px}
.hi{background:var(--green);color:#166534}.md{background:var(--amber);color:#92400E}.lo{background:#FEE2E2;color:#991B1B}
.back{color:var(--blue);font-weight:700;font-size:13px;margin-bottom:14px}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.hero .badge{width:56px;height:56px;font-size:22px}
.big{font-size:26px;font-weight:700}.big span{font-size:14px;color:var(--mute);font-weight:400}
.hist{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bg);font-size:13px}
.hist .d{width:110px;color:var(--mute)}.hist .t{flex:1}
.step{display:flex;gap:12px;margin:12px 0;font-size:13px;line-height:1.5}
.step b{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.pillgrey{display:inline-block;background:var(--line);padding:6px 12px;border-radius:12px;font-size:12px;margin:8px 0}
.warn{background:var(--amber);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.5;margin-top:14px}
.note{font-size:11px;color:var(--faint);margin-top:10px}
.sep{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:11px;font-weight:700;color:var(--mute)}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:#E2E8F0}
.alert{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alert .ai{width:36px;height:36px;border-radius:50%;background:#FEF2F2;display:grid;place-items:center}
.alert .tx{flex:1;min-width:220px}.alert .tx b{font-size:13px}.alert .tx p{font-size:11px;color:var(--mute);margin-top:3px}
.alert .meta{font-size:11px;color:var(--mute)}
.alert button{color:#0D9488;font-weight:700;font-size:12px;padding:8px 12px;border-radius:8px}
.alert button:hover{background:var(--line)}
.state{text-align:center;color:var(--mute);padding:60px 20px;font-size:14px}
.banner{background:#FEF2F2;color:#991B1B;border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:16px}
.banner button{color:var(--blue);font-weight:700;margin-left:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #CBD5E1;border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
@media (max-width:860px){
 body{grid-template-columns:1fr}
 aside{position:static;height:auto;padding:12px;display:flex;align-items:center;gap:10px;overflow-x:auto}
 .logo{margin:0}.logo img{max-height:40px}
 nav{display:flex;gap:6px}nav button{white-space:nowrap;margin:0}
 header{height:auto;flex-wrap:wrap;padding:12px 16px;gap:10px;position:static}
 #gsearch{width:140px}
 .cards{grid-template-columns:1fr}
 .head{display:none}.row{grid-template-columns:1fr auto 14px}.row .c3,.row .c4{display:none}
 main{padding:16px}
}
</style>
</head>
<body>
<aside>
  <div class="logo"><img src="/assets/App%20Logo.jpeg" alt="The Missing Rupee" onerror="this.replaceWith('The Missing Rupee')"></div>
  <nav id="nav" aria-label="Main"></nav>
</aside>
<div>
  <header>
    <h1 id="title">Overview</h1>
    <div class="actions">
      <span id="status"></span>
      <button class="pill" id="refresh" title="Run the AI analysis again on your latest transactions">Re-analyze</button>
      <input id="gsearch" type="search" placeholder="Search for something" aria-label="Search merchants">
      <button class="circ" title="Settings" aria-label="Settings"><img src="/assets/settings.jpg" alt="" onerror="this.replaceWith('⚙')"></button>
      <button class="circ bell" id="bell" title="Alerts" aria-label="Alerts"><img src="/assets/bell.png" alt="" onerror="this.replaceWith('🔔')"><span id="bellN" hidden></span></button>
      <img class="avatar" src="/assets/profile.png" alt="Profile" onerror="this.outerHTML='<span class=avatar>👤</span>'">
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}).format(n);
const fmt = d => { const t = new Date(d+'T00:00:00Z'); return isNaN(t) ? d : t.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}); };
const PER_YEAR = {monthly:12,quarterly:4,annual:1,'bi-weekly':26};
const MONTHS = {monthly:1,quarterly:3,annual:12};
const TABS = [['dashboard','Dashboard','Overview'],['transactions','Transactions','Transactions'],['alerts','Alerts & Insights','Alerts & Insights']];
const SOURCES = {gemini:'Live analysis',cache:'Saved analysis',sample:'Sample data'};
const DEFAULT_STEPS = n => [`Log into your ${n} account on their official website or app.`,'Navigate to Account Settings or Subscription & Billing.',"Select your active plan and click 'Cancel Subscription' or 'Disable Auto-Renew'.",'Save the cancellation confirmation receipt for your records.'];

const S = {data:null, q:'', cat:'All categories', freq:'All frequencies', error:false, loading:false};

const annualCost = c => c.amount * (PER_YEAR[c.frequency] ?? 12);
const confidence = c => c.history.length >= 3 ? ['HIGH','hi'] : c.history.length === 2 ? ['MEDIUM','md'] : ['LOW','lo'];
function nextPayment(c){
  const t = new Date(c.date+'T00:00:00Z'); if (isNaN(t)) return c.date;
  if (c.frequency === 'bi-weekly') t.setUTCDate(t.getUTCDate()+14);
  else t.setUTCMonth(t.getUTCMonth()+(MONTHS[c.frequency] ?? 1));
  return t.toISOString().slice(0,10);
}
function alertChange(a){
  if (a.type==='price_hike') return `${inr(a.old_amount)} → ${inr(a.new_amount)} (+${a.pct}%)`;
  if (a.type==='trial_converted') return `₹0 → ${inr(a.new_amount)}`;
  if (a.type==='new') return `New (${inr(a.new_amount)})`;
  return `Frequency: ${a.frequency}`;
}
const ALERT_TITLE = {price_hike:a=>`${a.merchant} price increased`,trial_converted:()=>'Free trial converted',new:()=>'New recurring payment started',frequency_increased:()=>'Billing frequency increased'};

/* ---------- data ---------- */
async function load(refresh=false){
  S.loading = true; S.error = false; paintChrome(); if (!S.data) paint();
  const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 90000);
  try{
    const r = await fetch('/api/analysis'+(refresh?'?refresh=true':''),{signal:ctl.signal});
    if (!r.ok) throw new Error(r.status);
    S.data = await r.json();
  }catch(e){ S.error = true; }
  clearTimeout(timer); S.loading = false; paintChrome(); paint();
}

/* ---------- chrome (sidebar, header) ---------- */
function paintChrome(){
  const {view} = route();
  $('#nav').innerHTML = TABS.map(([k,l])=>`<button data-go="${k}" class="${k===view?'on':''}" ${k===view?'aria-current="page"':''}>${l}</button>`).join('');
  $('#title').textContent = TABS.find(t=>t[0]===view)[2];
  const b = $('#refresh'); b.disabled = S.loading; b.innerHTML = S.loading ? '<span class="spin"></span>Analyzing…' : 'Re-analyze';
  const m = S.data?.meta; $('#status').textContent = m?.source ? SOURCES[m.source] + (m.updated_at ? ' · '+new Date(m.updated_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '') : '';
  const n = S.data?.alerts.length || 0; $('#bellN').hidden = !n; $('#bellN').textContent = n;
}

/* ---------- routing: #dashboard | #transactions | #transactions/<id> | #alerts ---------- */
function route(){
  const [view='dashboard', id] = location.hash.slice(1).split('/');
  return {view: TABS.some(t=>t[0]===view) ? view : 'dashboard', id: id && decodeURIComponent(id)};
}
function go(path){ location.hash = path; }
addEventListener('hashchange', ()=>{ paintChrome(); paint(); scrollTo(0,0); });

/* ---------- screens ---------- */
function paint(){
  const v = $('#view'), {view,id} = route(), d = S.data;
  if (!d) { v.innerHTML = S.error ? errorBox() : '<div class="state"><span class="spin"></span>Analyzing your transactions. The first run can take a few seconds.</div>'; return; }
  const banner = S.error ? errorBox() : '';
  if (view==='dashboard') v.innerHTML = banner + dashboard(d);
  else if (view==='alerts') v.innerHTML = banner + alertsView(d);
  else { const c = id && d.commitments.find(x=>x.id===id); v.innerHTML = banner + (c ? detail(c) : listView(d)); if (!c) bindList(); }
}
const errorBox = () => `<div class="banner">We couldn't load your data. Check that the server is running, then try again.<button data-act="retry">Try again</button></div>`;

function dashboard(d){
  const m = d.metrics, card = (bg,ic,l,v,f)=>`<div class="card"><div class="ico" style="background:${bg}">${ic}</div><div class="l">${l}</div><div class="v">${v}</div><div class="f">${f}</div></div>`;
  return `<div class="kick">OVERVIEW</div><h2>Your money, uncovered.</h2><p class="sub">A clear view of the recurring payments quietly leaving your account.</p>
  <div class="cards">
   ${card('#E2E8F0','🔄','Monthly recurring spend',inr(m.monthly),'Across identified commitments')}
   ${card('#DCFCE7','🐷','Annual commitment',inr(m.annual),'Your recurring baseline')}
   ${card('#E0F2FE','✓','Active subscriptions',m.active,`From ${m.merchants} merchant pattern${m.merchants===1?'':'s'}`)}
  </div>${d.alerts.length ? `<div class="box" style="margin-top:16px"><b>${d.alerts.length} alert${d.alerts.length===1?'':'s'} need${d.alerts.length===1?'s':''} a look.</b> <button class="back" data-go="alerts" style="margin:0 0 0 8px">See alerts</button></div>` : ''}`;
}

function filtered(d){
  const q = S.q.toLowerCase().trim();
  return d.commitments.filter(c =>
    (!q || [c.name,c.category,c.frequency].some(x=>x.toLowerCase().includes(q))) &&
    (S.cat==='All categories' || c.category===S.cat) && (S.freq==='All frequencies' || c.frequency===S.freq));
}
function listView(d){
  const uniq = k => [...new Set(d.commitments.map(c=>c[k]))].sort();
  const opt = (arr,all,cur) => [all,...arr].map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');
  return `<div class="kick">DISCOVERY</div><h2>All commitments</h2><p class="sub">Every recurring payment we found in your transaction history.</p>
  <div class="bar"><input id="q" type="search" placeholder="🔍  Search merchant or descriptor" value="${esc(S.q)}" aria-label="Search commitments">
   <select id="cat" aria-label="Category">${opt(uniq('category'),'All categories',S.cat)}</select>
   <select id="freq" aria-label="Frequency">${opt(uniq('frequency'),'All frequencies',S.freq)}</select><span id="count"></span></div>
  <div class="head"><span>MERCHANT</span><span>AMOUNT / FREQUENCY</span><span>LAST PAYMENT</span><span>CONFIDENCE</span><span></span></div>
  <div id="rows"></div>`;
}
function rows(){
  const list = filtered(S.data);
  $('#count').textContent = `${list.length} found`;
  $('#rows').innerHTML = list.length ? list.map(c=>{ const [cl,cls]=confidence(c); return `<button class="row" data-id="${esc(c.id)}">
    <span class="who"><span class="badge" style="background:${esc(c.bg)}">${esc(c.initial)}</span><span><b>${esc(c.name)}</b><small>${esc(c.frequency)} · ${esc(c.category)}</small></span></span>
    <span><b>${inr(c.amount)}</b><small>/${esc(c.frequency)}</small></span><span class="c3">${fmt(c.date)}</span><span class="c4"><span class="tag ${cls}">${cl}</span></span><i>›</i></button>`; }).join('')
    : `<div class="state">${S.data.commitments.length ? 'No commitments match these filters. Clear the search or pick "All".' : 'No recurring payments found yet. Add transactions to your database, then select Re-analyze.'}</div>`;
}
function bindList(){
  rows();
  $('#q').oninput = e => { S.q = e.target.value; $('#gsearch').value = S.q; rows(); };
  $('#cat').onchange = e => { S.cat = e.target.value; rows(); };
  $('#freq').onchange = e => { S.freq = e.target.value; rows(); };
}

function detail(c){
  const [cl,cls] = confidence(c), h = c.history, steps = c.cancellation_steps?.length ? c.cancellation_steps : DEFAULT_STEPS(c.name);
  return `<button class="back" data-go="transactions">←  All commitments</button>
  <div class="kick">INVESTIGATION</div><h2>${esc(c.name)}</h2><p class="sub">${esc(c.name.toUpperCase().replace(/\s/g,''))} · evidence-based recurring payment review</p>
  <div class="box hero"><div class="who"><span class="badge" style="background:${esc(c.bg)}">${esc(c.initial)}</span><div>
    <div class="big">${inr(c.amount)}<span> /${esc(c.frequency)}</span></div>
    <div class="sub" style="margin:4px 0 6px">Estimated next payment: ${fmt(nextPayment(c))}</div><span class="tag ${cls}">${cl} CONFIDENCE</span></div></div>
    <div style="text-align:right"><div class="sub" style="margin:0">Annual cost</div><div class="big">${inr(annualCost(c))}</div></div></div>
  <div class="box"><b>Payment history</b><p class="sub" style="margin:4px 0 10px">Matched ${h.length} payment${h.length===1?'':'s'} for ${esc(c.name)} with a ${esc(c.frequency)} billing pattern.</p>
    ${h.map((x,i)=>`<div class="hist"><span style="color:var(--faint)">•</span><span class="d">${fmt(x.date)}</span><span class="t">${esc(x.description)}</span><b>${inr(x.amount)}</b>${i===h.length-1?'<span class="tag hi">Latest</span>':''}</div>`).join('')}</div>
  <div class="box"><div class="kick">GUIDED CANCELLATION</div><h2 style="font-size:18px">How to stop this payment</h2>
    ${c.payment_mechanism ? `<span class="pillgrey">✓  Payment mechanism: ${esc(c.payment_mechanism)}</span>` : ''}
    ${steps.map((s,i)=>`<div class="step"><b>${i+1}</b><span>${esc(s)}</span></div>`).join('')}
    <div class="warn">⚠️  Important distinction: Revoking a mandate may stop future debits but does not automatically terminate the underlying merchant contract.</div>
    <p class="note">Steps are AI-generated and may be out of date. Check the merchant's site before relying on them.</p></div>`;
}

function alertsView(d){
  const groups = {}; d.alerts.forEach(a => (groups[a.date] ??= []).push(a));
  const body = Object.keys(groups).sort().reverse().map(date => `<div class="sep">${fmt(date)}</div>` + groups[date].map(a=>`
   <div class="alert"><span class="ai">⚠️</span><div class="tx"><b>${esc(ALERT_TITLE[a.type]?.(a) ?? a.type)}</b><p>${esc(a.message)}</p></div>
   <span class="meta">Merchant: ${esc(a.merchant)} &nbsp; Observed: ${esc(a.date)} &nbsp; Change: ${esc(alertChange(a))}</span>
   <button data-go="transactions/${encodeURIComponent(a.commitment_id)}">Investigate ↗</button></div>`).join('')).join('');
  return `<div class="kick">SIGNALS</div><h2>Alerts &amp; insights</h2><p class="sub">Understand what changed before it quietly costs you more.</p>` +
    (body || '<div class="state">No alerts detected in your transaction history.</div>');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-id],[data-act]'); if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.id) go('transactions/'+encodeURIComponent(t.dataset.id));
  else if (t.dataset.act==='retry') load();
});
$('#refresh').onclick = () => load(true);
$('#bell').onclick = () => go('alerts');
$('#gsearch').oninput = e => {
  S.q = e.target.value;
  const {view,id} = route();
  if (view!=='transactions' || id) go('transactions'); else { const q=$('#q'); if (q) q.value = S.q; rows(); }
};

paintChrome(); load();
</script>
</body>
</html>
